name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_BASE_PATH: /voltura-x-mejalism
      NEXT_PUBLIC_SITE_URL: https://louisenda86.github.io/voltura-x-mejalism
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        run: npm run build
      - name: Disable Jekyll processing
        run: touch dist/client/.nojekyll
      - name: Verify framework assets
        run: |
          test -f dist/client/.nojekyll
          find dist/client -path '*/_next/static/css/*.css' -type f -print -quit | grep -q .
          find dist/client -path '*/_next/static/chunks/*.js' -type f -print -quit | grep -q .
      - name: Archive Pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory dist/client \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.vite' \
            --exclude='.assetsignore' \
            --exclude='._*' \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            .
      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
